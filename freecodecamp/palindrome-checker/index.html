<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="principal_section">
        <h1>IS PALINDROME?</h1>
        <form>
            <p>Enter in text to check for a palindrome:</p><br>
            <div class="controls">
                <input type="text" id="text-input" placeholder="Palindrome Text">
                <button type="button" id="check-btn">Submit</button>
            </div>
        </form>
        <p id="result"></p>
        <div class="wts_palindrome">
            <p>&#10024;A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
        </div>
        <script src="script.js"></script>
    </main>
</body>
</html>
