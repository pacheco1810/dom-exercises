<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Museum-Gallery</title>
    </head>
    <body>
        <main class="mainContainer">
            <div class="title">
                <h1>Museum Gallery</h1>
            </div>
            <div class="gallery">
                <img src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" alt="stonehenge thumbnail" id="stonehenge-thumbnail" class="gallery-item">
                <img src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg" alt="storm thumbnail" id="storm-thumbnail" class="gallery-item">
                <img src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg" alt="trees thumbnail" id="trees-thumbnail" class="gallery-item">
            </div>
        </main>
        <div class="lightbox">
            <button id="close-btn">&times;</button>
            <img src="" alt="Image that changes when you click" id="lightbox-image">
        </div>

        <script src="script.js"></script>
    </body>
</html>
